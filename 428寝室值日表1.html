  }

  .panel {
    background: rgba(255,255,255,.82);
    border-radius: 22px;
    padding: 20px 18px;
    margin-bottom: 16px;
    box-shadow: 0 6px 18px rgba(120,100,70,.10);
    border: 2px dashed rgba(107,79,58,.18);
  }
  .panel-title {
    display: flex; align-items: center; gap: 8px;
    font-size: 20px; font-weight: 700; color: #5b7553;
    margin-bottom: 14px;
  }
  .panel-title .sub { font-size: 12px; font-weight: 400; color: #9aa58f; margin-left: auto; }

  /* 周切换 */
  .week-bar { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .week-bar button {
    border: none; cursor: pointer;
    background: #bfe3c6; color: #3f5e46;
    font-size: 14px; font-weight: 700;
    padding: 8px 16px; border-radius: 999px;
    transition: transform .12s, background .12s;
    font-family: inherit;
  }
  .week-bar button:hover { background: #a9d8b3; }
  .week-bar button:active { transform: scale(.94); }
  .week-bar button.back { background: #f3d9e2; color: #9a5568; }
  .week-bar button.back:hover { background: #ecc6d3; }
  .week-info { text-align: center; min-width: 200px; }
  .week-info .wname { font-size: 21px; font-weight: 800; color: #4a6b52; }
  .week-info .wrange { font-size: 13px; color: #8a9a86; margin-top: 2px; }
  .week-info .today-tag { display:inline-block; font-size:11px; background:#ffd166; color:#8a5a00; border-radius:999px; padding:1px 9px; margin-left:6px; vertical-align: middle; }

  /* 值日条目 */
  .duty-list { display: grid; gap: 12px; }
  .duty-row {
    display: flex; align-items: center; gap: 10px;
    background: #fff;
    border-radius: 16px;
    padding: 12px 14px;
    box-shadow: 0 3px 8px rgba(120,100,70,.08);
    border: 2px solid #eef5ea;
  }
  .who { display: flex; align-items: center; gap: 10px; flex: 1.1; min-width: 0; }
  .num-badge {
    width: 30px; height: 30px; flex: 0 0 30px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; color: #fff; font-size: 15px;
  }
  .who .meta { min-width: 0; }
  .who .name { font-size: 18px; font-weight: 800; color: #444; display: flex; align-items: center; gap: 7px; }
  .who .name .face { font-size: 16px; }
  .arrow { font-size: 18px; color: #b8c9b5; flex: 0 0 auto; }
  .area {
    flex: 1.2; min-width: 0;
    display: flex; align-items: center; gap: 8px;
    border-radius: 12px;
    padding: 10px 12px;
    font-weight: 800; font-size: 16px;
  }
  .area .aicon { font-size: 22px; }
  .c-blue   { background: #d8e9ff; color: #2f5d9e; }
  .c-pink   { background: #ffdce8; color: #b23a68; }
  .c-purple { background: #ead9ff; color: #6f3fa8; }
  .c-green  { background: #d9f2d0; color: #3f7a34; }
  .c-yellow { background: #ffeec4; color: #9a6c10; }
  .c-cyan   { background: #c9f0f2; color: #1f7a80; }
  .b1{background:#ff8fab;} .b2{background:#f48fb1;} .b3{background:#ce93d8;}
  .b4{background:#90caf9;} .b5{background:#ffb74d;} .b6{background:#a1887f;}

  /* 轮换总览 */
  .overview { width: 100%; border-collapse: separate; border-spacing: 0 6px; font-size: 13px; }
  .overview th { color: #8aa084; font-weight: 600; padding: 4px 6px; text-align: center; font-size: 12px; }
  .overview td { background: #f7faf4; padding: 8px 4px; text-align: center; }
  .overview td.weekcell { text-align: left; padding-left: 12px; font-weight: 700; color: #5b7553; white-space: nowrap; }
  .overview td .wk { font-size: 13px; }
  .overview td .dt { font-size: 11px; color: #9db0a0; }
  .overview tr.cur td { background: #e7f6e2; }
  .overview tr.cur td.weekcell .wk::after { content: "·本周"; color: #e08a00; font-size: 11px; margin-left: 4px; }
  .overview tr td:first-child { border-radius: 12px 0 0 12px; }
  .overview tr td:last-child { border-radius: 0 12px 12px 0; }

  .footer { text-align: center; color: #b3a892; font-size: 13px; margin-top: 6px; letter-spacing: 2px; }

  /* ===== 添加到桌面引导 ===== */
  .desktop-btn {
    position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    z-index: 50; border: none; cursor: pointer;
    background: linear-gradient(135deg, #74c69d, #52b788);
    color: #fff; font-size: 14px; font-weight: 600;
    padding: 12px 18px; border-radius: 999px;
    box-shadow: 0 6px 18px rgba(82,183,136,.45);
  }
  .desktop-btn:active { transform: scale(.96); }
  .guide-mask {
    position: fixed; inset: 0; z-index: 60; display: none;
    background: rgba(0,0,0,.45); align-items: flex-end; justify-content: center;
  }
  .guide-mask.show { display: flex; }
  .guide-card {
    background: #fffdf7; width: 100%; max-width: 480px;
    border-radius: 20px 20px 0 0; padding: 20px 22px calc(20px + env(safe-area-inset-bottom, 0px));
  }
  .guide-card h3 { margin: 0 0 4px; font-size: 17px; color: #3d5a45; }
  .guide-card .tip { font-size: 12px; color: #b3a892; margin-bottom: 12px; }
  .guide-card ol { margin: 0; padding-left: 20px; font-size: 14px; color: #4a4a4a; line-height: 1.9; }
  .guide-card ol b { color: #2d6a4f; }
  .guide-close {
    margin-top: 14px; width: 100%; border: none; cursor: pointer;
    background: #d8f3dc; color: #2d6a4f; font-size: 15px; font-weight: 600;
    padding: 12px; border-radius: 12px;
  }

  @media (max-width: 560px) {
    .title-card h1 { font-size: 26px; letter-spacing: 2px; }
    .duty-row { flex-wrap: wrap; }
    .arrow { display: none; }
    .area { flex: 1 1 100%; justify-content: flex-start; }
    .overview { font-size: 12px; }
  }
</style>
</head>

  { name: '赵雨菲', day: '周四', face: '🌈', badge: 'b4' },
  { name: '张亚飞', day: '周五', face: '🌻', badge: 'b5' },
  { name: '蔡妍',   day: '周六', face: '☕', badge: 'b6' }
];
const AREAS = [
  { name: '阳台',       icon: '🪴', cls: 'c-blue'   },
  { name: '室内扫地',   icon: '🧹', cls: 'c-pink'   },
  { name: '室内拖地',   icon: '🪣', cls: 'c-purple' },
  { name: '洗手台',     icon: '🚰', cls: 'c-green'  },
  { name: '厕所',       icon: '🚽', cls: 'c-yellow' },
  { name: '洗手台地面', icon: '💧', cls: 'c-cyan'   }
];
const N = 6;
const DEFAULT_BASE = '2026-10-05'; // 基准周（1-1）的周一

let viewDelta = 0; // 相对本周查看偏移（0=本周）

/* ===== 日期工具 ===== */
function mondayOf(d) {
  const x = new Date(d); x.setHours(0,0,0,0);
  const wd = (x.getDay() + 6) % 7; // 周一=0
  x.setDate(x.getDate() - wd);
  return x;
}
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function fmtMD(d) { return (d.getMonth()+1) + '月' + d.getDate() + '日'; }
function fmtISO(d) {
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate());
}
function diffWeeks(aMon, bMon) {
  return Math.round((aMon - bMon) / (7 * 24 * 3600 * 1000));
}
function getBaseMonday() {
  return mondayOf(DEFAULT_BASE + 'T00:00:00');
}

/* ===== 渲染 ===== */
function areaIndexOf(memberIdx, offset) {
  return ((memberIdx + offset) % N + N) % N; // offset周：人 i -> 区域 i+offset
}

function render() {
  const now = new Date();
  const thisMonday = mondayOf(now);
  const baseMonday = getBaseMonday();
  const currentOffset = diffWeeks(thisMonday, baseMonday); // 本周相对基准周的周数
  const showOffset = currentOffset + viewDelta;

  document.getElementById('todayText').textContent =
    '今天 ' + now.getFullYear() + '年' + fmtMD(now);

  const showMonday = addDays(thisMonday, viewDelta * 7);
  const showSunday = addDays(showMonday, 6);
  document.getElementById('weekName').textContent = '第 ' + (showOffset + 1) + ' 周';
  document.getElementById('weekRange').textContent =
    fmtMD(showMonday) + ' — ' + fmtMD(showSunday) +
    (viewDelta === 0 ? '' : '');
  const wr = document.getElementById('weekRange');
  if (viewDelta === 0) {
    wr.innerHTML = fmtMD(showMonday) + ' — ' + fmtMD(showSunday) + '<span class="today-tag">TODAY</span>';
  } else {
    wr.textContent = fmtMD(showMonday) + ' — ' + fmtMD(showSunday);
  }
  document.getElementById('backBtn').style.display = viewDelta === 0 ? 'none' : '';

  // 值日条目
  const list = document.getElementById('dutyList');
  list.innerHTML = '';
  MEMBERS.forEach((m, i) => {
    const a = AREAS[areaIndexOf(i, showOffset)];
    const row = document.createElement('div');
    row.className = 'duty-row';
    row.innerHTML =
      '<div class="who">' +
        '<div class="num-badge ' + m.badge + '">' + (i+1) + '</div>' +
        '<div class="meta"><div class="name">' + m.name + '<span class="face">' + m.face + '</span></div></div>' +
      '</div>' +
      '<div class="arrow">➜</div>' +
      '<div class="area ' + a.cls + '"><span class="aicon">' + a.icon + '</span>' + a.name + '</div>';
    list.appendChild(row);
  });

  renderOverview(currentOffset);
}

function renderOverview(currentOffset) {
  const table = document.getElementById('overviewTable');
  let html = '<thead><tr><th>周次</th>';
  MEMBERS.forEach(m => html += '<th>' + m.name + '</th>');
  html += '</tr></thead><tbody>';

  // 从本周起展示未来6周（覆盖一个完整循环）
  for (let k = 0; k < N; k++) {
    const off = currentOffset + k;
    const mon = addDays(mondayOf(new Date()), k * 7);
    const sun = addDays(mon, 6);
    html += '<tr class="' + (k === 0 ? 'cur' : '') + '">' +
      '<td class="weekcell"><div class="wk">第' + (off + 1) + '周</div>' +
      '<div class="dt">' + fmtMD(mon) + '起</div></td>';
    MEMBERS.forEach((m, i) => {
      const a = AREAS[areaIndexOf(i, off)];
      html += '<td><span title="' + m.name + '→' + a.name + '">' + a.icon + '</span>' +
        '<div style="font-size:10.5px;color:#7d8f78;margin-top:2px;">' + a.name + '</div></td>';
    });
    html += '</tr>';
  }
  html += '</tbody>';
  table.innerHTML = html;
}

function shiftView(delta) { viewDelta += delta; render(); }
function backToCurrent() { viewDelta = 0; render(); }

/* ===== 初始化 ===== */
render();
// 页面长时间打开时，每分钟检查一次是否跨周
setInterval(render, 60 * 1000);

// 已经以桌面快捷方式（standalone）打开时，隐藏引导按钮
if (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) {
  document.getElementById('desktopBtn').style.display = 'none';
}
</script>
</body>
</html>
